# Library versions for every module.
# compileSdk / minSdk / targetSdk are not here: build-logic's GallerySdk is the
# single place those are set (36 / 30 / 36). Keep the Android Gradle Plugin and
# Kotlin versions below in sync with build-logic/build.gradle.kts.

[versions]
agp = "8.13.2"
kotlin = "2.2.21"
coreKtx = "1.18.0"
activity = "1.13.0"
# 2.11 requires compileSdk 37. 2.10 is the newest lifecycle that still builds against API 36.
lifecycle = "2.10.0"
# Newest Compose BOM that still compiles against API 36.
# BOM 2026.08.00 (Compose 1.12) and later require compileSdk 37.
composeBom = "2026.06.01"
coroutines = "1.11.0"
# 2.12 still compiles against API 33+, so it stays on compileSdk 36.
work = "2.12.0"
junit = "4.13.2"
extJunit = "1.3.0"
robolectric = "4.18.1"
# Interpreter line. LiteRT 2.x keeps Interpreter on the CPU and has no NNAPI
# accelerator on CompiledModel, so GPU and NNAPI delegates stay on 1.4.x.
litert = "1.4.2"
# Bundled on-device models. Not the unbundled download variants.
mlkitFace = "16.1.7"
mlkitImageLabeling = "17.0.9"
androidxTest = "1.7.0"
# KSP builds must match the Kotlin version above. 2.2.21-2.0.5 is the KSP release for Kotlin 2.2.21.
ksp = "2.2.21-2.0.5"
# room-ktx was merged into room-runtime in Room 2.7. Do not add that artifact.
room = "2.8.5"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "extJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTest" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
litert-gpu = { group = "com.google.ai.edge.litert", name = "litert-gpu", version.ref = "litert" }
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkitFace" }
mlkit-image-labeling = { group = "com.google.mlkit", name = "image-labeling", version.ref = "mlkitImageLabeling" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
